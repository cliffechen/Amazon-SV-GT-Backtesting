[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-sv-gt-backtesting"
version = "0.1.0"
description = "Auditable ingredient demand forecasts and rolling backtests"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "plotly>=5.24", "requests>=2.32"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ingredient-predictor = "predictor.cli:main"

[tool.setuptools.packages.find]
include = ["predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
